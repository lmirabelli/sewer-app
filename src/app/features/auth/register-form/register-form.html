<form [formGroup]="registerForm" (ngSubmit)="enviarRegistro.emit()" class="space-y-5">

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
            <label class="block text-sm font-medium text-slate-300">Nombre</label>
            <input formControlName="nombre" type="text"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300">Apellido</label>
            <input formControlName="apellido" type="text"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
        </div>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
            <label class="block text-sm font-medium text-slate-300">Nombre de usuario</label>
            <input formControlName="username" type="text"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300">Correo electrónico</label>
            <input formControlName="email" type="email"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
        </div>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
            <label class="block text-sm font-medium text-slate-300">Contraseña</label>
            <input formControlName="password" type="password"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
            <span class="text-[10px]">(Mín. 8, 1 Mayús, 1 Núm)</span>
        </div>
        <div>
            <label class="block text-sm font-medium text-slate-300">Repetir contraseña</label>
            <input formControlName="confirmPassword" type="password"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
        </div>
    </div>

    <div class="grid grid-cols-1 gap-5 sm:grid-cols-2">
        <div>
            <label class="block text-sm font-medium text-slate-300">Fecha de nacimiento</label>
            <input formControlName="fechaNacimiento" type="date"
                class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none">
        </div>
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-300">Descripción breve (Bio)</label>
        <textarea formControlName="descripcionBreve" rows="2"
            class="mt-1 block w-full rounded-lg bg-[#1f2937] border border-slate-700 text-white px-3 py-2 focus:ring-2 focus:ring-slate-500 focus:border-slate-500 outline-none"></textarea>
    </div>

    <div>
        <label class="block text-sm font-medium text-slate-300">Imagen de perfil</label>
        <input type="file" (change)="archivoSeleccionado.emit($event)" accept="image/*"
            class="mt-1 block w-full text-sm text-slate-400 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-[#1e293b] file:text-white hover:file:bg-[#334155] cursor-pointer">
    </div>

    <div class="pt-2">
        <button [disabled]="loading" type="submit"
            class="w-full flex justify-center py-2.5 px-4 border border-slate-600 rounded-lg shadow-sm text-sm font-bold text-white bg-[#1e293b] hover:bg-[#334155] focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-slate-400 transition-all cursor-pointer">
            {{ loading ? 'Registrando...' : 'Registrate en la Cloaca' }}
        </button>
    </div>

    <div class="text-center text-sm pt-2">
        <span class="text-slate-400">¿Ya tenés cuenta? </span>
        <a routerLink="/login" class="font-medium text-slate-200 hover:text-white underline">Iniciá sesión acá</a>
    </div>

</form>
