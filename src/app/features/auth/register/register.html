<div class="min-h-screen bg-[#0b0f19] text-gray-100 flex flex-col justify-center py-12 sm:px-6 lg:px-8">
    <app-register-header></app-register-header>

    <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-xl px-4">
        <div class="bg-[#111827] py-8 px-6 shadow-2xl sm:rounded-xl border border-slate-800">
            <app-register-form 
                [registerForm]="registerForm" 
                [loading]="loading"
                (enviarRegistro)="onSubmit()" 
                (archivoSeleccionado)="onFileSelected($event)">
            </app-register-form>
        </div>
    </div>
</div>
